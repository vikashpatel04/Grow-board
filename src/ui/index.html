<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- The page is loaded from file://, where CSP 'self' does not match (opaque origin),
     so local scripts must be allowed explicitly via the file: scheme. There is no
     remote content in this app; contextIsolation and the preload allowlist are the
     real boundary. -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' 'unsafe-inline' file:; img-src 'self' data: file:; font-src file:;">
<title>Grow Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M7 22 L13 15 L18 19 L25 9" stroke="#fff" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="25" cy="9" r="2.6" fill="#fff"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Grow Board</div>
        <div class="brand-sub" id="brandSub">Dhanalakshmi Textiles</div>
      </div>
    </div>

    <nav class="nav-group">
      <div class="nav-title">Run the day</div>
      <button class="nav-item active" data-page="today">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        Today
      </button>
      <button class="nav-item" data-page="actions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 L4 14h7l-1 8 9-12h-7z"/></svg>
        Focus
        <span class="nav-badge" id="actionBadge" hidden>0</span>
      </button>
    </nav>

    <nav class="nav-group">
      <div class="nav-title">Grow</div>
      <button class="nav-item" data-page="growth">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M17 7h4v4"/></svg>
        Growth
      </button>
      <button class="nav-item" data-page="profit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Profit
      </button>
      <button class="nav-item" data-page="stock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 12l9 5 9-5M3 16l9 5 9-5"/></svg>
        Stock
        <span class="nav-badge warn" id="stockBadge" hidden>0</span>
      </button>
      <button class="nav-item" data-page="suppliers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h18M3 9l2-5h14l2 5M5 9v11h14V9"/><path d="M9 13h6"/></svg>
        Suppliers
      </button>
      <button class="nav-item" data-page="customers">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 20c0-2.4-1-4.5-2.6-5.8"/></svg>
        Customers
      </button>
    </nav>

    <nav class="nav-group">
      <div class="nav-title">Trust the numbers</div>
      <button class="nav-item" data-page="health">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/></svg>
        Data Health
        <span class="nav-badge" id="healthBadge" hidden>0</span>
      </button>
      <button class="nav-item" data-page="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7.5a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 2.7-1.1V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H23a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.6z"/></svg>
        Settings
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting...</span></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Today</h1>
        <div class="sub" id="pageSub">&nbsp;</div>
      </div>
      <div class="topbar-right">
        <button class="btn sm" id="themeBtn" title="Switch light / dark">Light</button>
        <button class="btn sm" id="refreshBtn">Refresh</button>
      </div>
    </header>

    <div class="scroll" id="scroll">
      <section class="page active" id="page-today"><div class="loading">Loading today...</div></section>
      <section class="page" id="page-actions"><div class="loading">Loading...</div></section>
      <section class="page" id="page-growth"><div class="loading">Loading...</div></section>
      <section class="page" id="page-profit"><div class="loading">Loading...</div></section>
      <section class="page" id="page-stock"><div class="loading">Loading...</div></section>
      <section class="page" id="page-suppliers"><div class="loading">Loading...</div></section>
      <section class="page" id="page-customers"><div class="loading">Loading...</div></section>
      <section class="page" id="page-health"><div class="loading">Loading...</div></section>
      <section class="page" id="page-settings"><div class="loading">Loading...</div></section>
    </div>
  </main>
</div>

<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
